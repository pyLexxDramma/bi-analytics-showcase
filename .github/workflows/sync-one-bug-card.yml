# Sync one bug card by Trello short link
name: Sync one bug card

on:
  workflow_dispatch:
    inputs:
      card_ref:
        description: Trello short link
        required: true
        default: jQJyZvWO

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync card and report notify
        uses: appleboy/ssh-action@v1.2.4
        env:
          CARD_REF: ${{ github.event.inputs.card_ref }}
        with:
          host: ${{ secrets.WEBAPP_VPS_HOST }}
          username: ${{ secrets.WEBAPP_VPS_USER }}
          password: ${{ secrets.WEBAPP_VPS_PASSWORD }}
          key: ${{ secrets.WEBAPP_VPS_SSH_KEY }}
          port: ${{ secrets.WEBAPP_VPS_PORT || 2275 }}
          envs: CARD_REF
          command_timeout: 5m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.PROD_VPS_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/apps/bi-analytics-webapp-prod}"
            cd "$APP_DIR/webapp"
            COMPOSE=(docker compose -p webapp-prod -f docker-compose.yml -f docker-compose.prod.yml)
            CID=$("${COMPOSE[@]}" ps -q api)
            docker exec -i -e CARD_REF="$CARD_REF" "$CID" python - <<'PY'
            import os, sys, sqlite3, json
            sys.path.insert(0, "/core")
            users_db = os.environ.get("BI_USERS_DB", "/data/db/users.db")
            import config as core_config
            core_config.DB_PATH = users_db
            from bug_report.storage import ensure_bug_reports_table, get_bug_report
            from bug_report.status_sync import sync_one_report, _fetch_card_list_name
            ensure_bug_reports_table()
            ref = (os.environ.get("CARD_REF") or "").strip()
            con = sqlite3.connect(users_db)
            con.row_factory = sqlite3.Row
            row = con.execute(
                """
                SELECT * FROM bug_reports
                WHERE trello_card_url LIKE ? OR trello_card_id LIKE ?
                ORDER BY id DESC LIMIT 1
                """,
                (f"%{ref}%", f"%{ref}%"),
            ).fetchone()
            con.close()
            if not row:
                print("NOT_FOUND")
                raise SystemExit(2)
            d = dict(row)
            card_id = d.get("trello_card_id")
            list_name = _fetch_card_list_name(str(card_id or ""))
            print("before", json.dumps({
                "id": d.get("id"), "user_seq": d.get("user_seq"),
                "client_status": d.get("client_status"),
                "notified_in_progress_at": d.get("notified_in_progress_at"),
                "email_domain": (d.get("contact_email") or "").split("@")[-1],
                "trello_list": list_name,
            }, ensure_ascii=False))
            info = sync_one_report(d)
            print("sync", json.dumps(info, ensure_ascii=False))
            after = get_bug_report(int(d["id"])) or {}
            print("after", json.dumps({
                "client_status": after.get("client_status"),
                "notified_in_progress_at": after.get("notified_in_progress_at"),
            }, ensure_ascii=False))
            PY
