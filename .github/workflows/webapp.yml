name: Webapp CI + Deploy

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "bi-analytics-v-5-main/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "webapp/**"
      - "bi-analytics-v-5-main/**"
  workflow_dispatch:

concurrency:
  group: webapp-deploy
  cancel-in-progress: false

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python -c "from app.services.debit_credit import build_debit_credit_payload; p=build_debit_credit_payload(); assert 'kpis' in p; print(p['meta'], p['kpis'])"
      - run: python -m pytest tests -q

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        working-directory: webapp
        env:
          WEBAPP_AUTH_SECRET: ci-only-auth-secret-with-more-than-32-characters
          SHOWCASE_VLLM_BASE_URL: http://vllm.invalid/v1
      - run: docker compose build api opencode
        working-directory: webapp
        env:
          WEBAPP_AUTH_SECRET: ci-only-auth-secret-with-more-than-32-characters
          SHOWCASE_VLLM_BASE_URL: http://vllm.invalid/v1

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json
      - run: npm ci
      - name: Build local stub mode
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""
          NEXT_PUBLIC_AI_MODE: stub
      - name: Build deployed full mode
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""
          NEXT_PUBLIC_AI_MODE: full

  deploy-vps:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [api-smoke, docker-validate, web-build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.WEBAPP_VPS_HOST }}
          username: ${{ secrets.WEBAPP_VPS_USER }}
          password: ${{ secrets.WEBAPP_VPS_PASSWORD }}
          key: ${{ secrets.WEBAPP_VPS_SSH_KEY }}
          port: ${{ secrets.WEBAPP_VPS_PORT || 22 }}
          command_timeout: 30m
          envs: XCA_ASK_SECRET,XCA_ASK_BASE_URL,GH_FETCH_TOKEN,TRELLO_API_KEY,TRELLO_TOKEN,TRELLO_BOARD_ID,TRELLO_LIST_URGENT,TRELLO_LIST_BUG,TRELLO_LIST_UI,TRELLO_LIST_FEATURE,TRELLO_LIST_QUESTION,TRELLO_LIST_TRIAGE,TRELLO_LABEL_URGENT,TRELLO_LABEL_BUG,TRELLO_LABEL_UI,TRELLO_LABEL_FEATURE,TRELLO_LABEL_QUESTION,TRELLO_LABEL_TRIAGE,BUG_REPORT_DRY_RUN,BUG_REPORT_SMTP_HOST,BUG_REPORT_SMTP_PORT,BUG_REPORT_SMTP_USER,BUG_REPORT_SMTP_PASSWORD,BUG_REPORT_SMTP_FROM,BUG_REPORT_SMTP_SSL,BUG_REPORT_TELEGRAM_BOT_TOKEN,BUG_REPORT_SYNC_KEY
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.WEBAPP_VPS_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/apps/bi-analytics-showcase}"
            mkdir -p "$(dirname "$APP_DIR")"
            if [[ ! -d "$APP_DIR/.git" ]]; then
              if [[ -n "${GH_FETCH_TOKEN:-}" ]]; then
                git clone "https://x-access-token:${GH_FETCH_TOKEN}@github.com/pyLexxDramma/bi-analytics-showcase.git" "$APP_DIR"
              else
                git clone https://github.com/pyLexxDramma/bi-analytics-showcase.git "$APP_DIR"
              fi
            fi
            cd "$APP_DIR"
            if [[ -n "${GH_FETCH_TOKEN:-}" ]]; then
              git remote set-url origin "https://x-access-token:${GH_FETCH_TOKEN}@github.com/pyLexxDramma/bi-analytics-showcase.git"
            fi
            git fetch origin
            git checkout main
            git reset --hard origin/main
            export XCA_ASK_SECRET="${XCA_ASK_SECRET:-}"
            export XCA_ASK_BASE_URL="${XCA_ASK_BASE_URL:-}"
            export TRELLO_API_KEY="${TRELLO_API_KEY:-}"
            export TRELLO_TOKEN="${TRELLO_TOKEN:-}"
            export TRELLO_BOARD_ID="${TRELLO_BOARD_ID:-}"
            export TRELLO_LIST_URGENT="${TRELLO_LIST_URGENT:-}"
            export TRELLO_LIST_BUG="${TRELLO_LIST_BUG:-}"
            export TRELLO_LIST_UI="${TRELLO_LIST_UI:-}"
            export TRELLO_LIST_FEATURE="${TRELLO_LIST_FEATURE:-}"
            export TRELLO_LIST_QUESTION="${TRELLO_LIST_QUESTION:-}"
            export TRELLO_LIST_TRIAGE="${TRELLO_LIST_TRIAGE:-}"
            export TRELLO_LABEL_URGENT="${TRELLO_LABEL_URGENT:-}"
            export TRELLO_LABEL_BUG="${TRELLO_LABEL_BUG:-}"
            export TRELLO_LABEL_UI="${TRELLO_LABEL_UI:-}"
            export TRELLO_LABEL_FEATURE="${TRELLO_LABEL_FEATURE:-}"
            export TRELLO_LABEL_QUESTION="${TRELLO_LABEL_QUESTION:-}"
            export TRELLO_LABEL_TRIAGE="${TRELLO_LABEL_TRIAGE:-}"
            export BUG_REPORT_DRY_RUN="${BUG_REPORT_DRY_RUN:-0}"
            # Ссылки статус-страниц на cloudpub (не брать prod BUG_STATUS_PUBLIC_BASE).
            export BUG_STATUS_PUBLIC_BASE="https://insipidly-carefree-husky.cloudpub.ru"
            export BUG_REPORT_SMTP_HOST="${BUG_REPORT_SMTP_HOST:-}"
            export BUG_REPORT_SMTP_PORT="${BUG_REPORT_SMTP_PORT:-587}"
            export BUG_REPORT_SMTP_USER="${BUG_REPORT_SMTP_USER:-}"
            export BUG_REPORT_SMTP_PASSWORD="${BUG_REPORT_SMTP_PASSWORD:-}"
            export BUG_REPORT_SMTP_FROM="${BUG_REPORT_SMTP_FROM:-}"
            export BUG_REPORT_SMTP_SSL="${BUG_REPORT_SMTP_SSL:-0}"
            export BUG_REPORT_TELEGRAM_BOT_TOKEN="${BUG_REPORT_TELEGRAM_BOT_TOKEN:-}"
            export BUG_REPORT_SYNC_KEY="${BUG_REPORT_SYNC_KEY:-}"
            bash webapp/scripts/server_deploy.sh
            echo "Deployed $(git rev-parse --short HEAD) edge :3080"
        env:
          XCA_ASK_SECRET: ${{ secrets.XCA_ASK_SECRET }}
          XCA_ASK_BASE_URL: ${{ secrets.XCA_ASK_BASE_URL }}
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_URGENT: ${{ secrets.TRELLO_LIST_URGENT }}
          TRELLO_LIST_BUG: ${{ secrets.TRELLO_LIST_BUG }}
          TRELLO_LIST_UI: ${{ secrets.TRELLO_LIST_UI }}
          TRELLO_LIST_FEATURE: ${{ secrets.TRELLO_LIST_FEATURE }}
          TRELLO_LIST_QUESTION: ${{ secrets.TRELLO_LIST_QUESTION }}
          TRELLO_LIST_TRIAGE: ${{ secrets.TRELLO_LIST_TRIAGE }}
          TRELLO_LABEL_URGENT: ${{ secrets.TRELLO_LABEL_URGENT }}
          TRELLO_LABEL_BUG: ${{ secrets.TRELLO_LABEL_BUG }}
          TRELLO_LABEL_UI: ${{ secrets.TRELLO_LABEL_UI }}
          TRELLO_LABEL_FEATURE: ${{ secrets.TRELLO_LABEL_FEATURE }}
          TRELLO_LABEL_QUESTION: ${{ secrets.TRELLO_LABEL_QUESTION }}
          TRELLO_LABEL_TRIAGE: ${{ secrets.TRELLO_LABEL_TRIAGE }}
          BUG_REPORT_DRY_RUN: ${{ secrets.BUG_REPORT_DRY_RUN }}
          BUG_REPORT_SMTP_HOST: ${{ secrets.BUG_REPORT_SMTP_HOST }}
          BUG_REPORT_SMTP_PORT: ${{ secrets.BUG_REPORT_SMTP_PORT }}
          BUG_REPORT_SMTP_USER: ${{ secrets.BUG_REPORT_SMTP_USER }}
          BUG_REPORT_SMTP_PASSWORD: ${{ secrets.BUG_REPORT_SMTP_PASSWORD }}
          BUG_REPORT_SMTP_FROM: ${{ secrets.BUG_REPORT_SMTP_FROM }}
          BUG_REPORT_SMTP_SSL: ${{ secrets.BUG_REPORT_SMTP_SSL }}
          BUG_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.BUG_REPORT_TELEGRAM_BOT_TOKEN }}
          BUG_REPORT_SYNC_KEY: ${{ secrets.BUG_REPORT_SYNC_KEY }}
