name: Webapp CI + Deploy

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "bi-analytics-v-5-main/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "webapp/**"
      - "bi-analytics-v-5-main/**"
  workflow_dispatch:

concurrency:
  group: webapp-deploy
  cancel-in-progress: false

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python -c "from app.services.debit_credit import build_debit_credit_payload; p=build_debit_credit_payload(); assert 'kpis' in p; print(p['meta'], p['kpis'])"
      - run: python -m pytest tests -q

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        working-directory: webapp
        env:
          WEBAPP_AUTH_SECRET: ci-only-auth-secret-with-more-than-32-characters
          SHOWCASE_VLLM_BASE_URL: http://vllm.invalid/v1
      - run: docker compose build api opencode
        working-directory: webapp
        env:
          WEBAPP_AUTH_SECRET: ci-only-auth-secret-with-more-than-32-characters
          SHOWCASE_VLLM_BASE_URL: http://vllm.invalid/v1

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json
      - run: npm ci
      - name: Build local stub mode
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""
          NEXT_PUBLIC_AI_MODE: stub
      - name: Build deployed full mode
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ""
          NEXT_PUBLIC_AI_MODE: full

  deploy-vps:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [api-smoke, docker-validate, web-build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.WEBAPP_VPS_HOST }}
          username: ${{ secrets.WEBAPP_VPS_USER }}
          password: ${{ secrets.WEBAPP_VPS_PASSWORD }}
          key: ${{ secrets.WEBAPP_VPS_SSH_KEY }}
          port: ${{ secrets.WEBAPP_VPS_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.WEBAPP_VPS_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/apps/bi-analytics-showcase}"
            mkdir -p "$(dirname "$APP_DIR")"
            if [[ ! -d "$APP_DIR/.git" ]]; then
              git clone https://github.com/pyLexxDramma/bi-analytics-showcase.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git reset --hard origin/main
            bash webapp/scripts/server_deploy.sh
            echo "Deployed $(git rev-parse --short HEAD) edge :3080"
