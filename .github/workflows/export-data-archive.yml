# Архив только свежего снапшота FTP (файлы самой новой даты DD-MM-YYYY).
# Скачать: Actions → Export data archive → Artifacts (хранятся 30 дней).
name: Export data archive

on:
  workflow_dispatch:

concurrency:
  group: export-data-archive-showcase
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pack latest snapshot on VPS
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.WEBAPP_VPS_HOST }}
          username: ${{ secrets.WEBAPP_VPS_USER }}
          key: ${{ secrets.WEBAPP_VPS_SSH_KEY }}
          password: ${{ secrets.WEBAPP_VPS_PASSWORD }}
          port: ${{ secrets.WEBAPP_VPS_PORT || 22 }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.WEBAPP_VPS_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/apps/bi-analytics-showcase}"
            WEB_DIR="$APP_DIR/webapp/data/web"
            OUT_DIR="$APP_DIR/webapp/data/exports"
            mkdir -p "$OUT_DIR"
            rm -f "$OUT_DIR"/showcase_ftp_snapshot_*.tar.gz
            rm -rf "$OUT_DIR"/staging

            if [[ ! -d "$WEB_DIR" ]]; then
              echo "ERROR: web dir missing: $WEB_DIR"
              exit 1
            fi

            # Самая свежая дата в именах файлов (DD-MM-YYYY → сортируем как YYYYMMDD)
            LATEST_DATE="$(
              find "$WEB_DIR" -type f -printf '%f\n' \
                | grep -oE '[0-9]{2}-[0-9]{2}-[0-9]{4}' \
                | awk -F- '{ print $3$2$1"\t"$0 }' \
                | sort -u \
                | tail -n1 \
                | cut -f2
            )"
            if [[ -z "${LATEST_DATE}" ]]; then
              echo "ERROR: no DD-MM-YYYY dates in filenames under $WEB_DIR"
              exit 1
            fi
            echo "==> latest snapshot date: ${LATEST_DATE}"

            LIST="$OUT_DIR/snapshot_files.txt"
            find "$WEB_DIR" -type f -name "*${LATEST_DATE}*" -printf '%P\n' | sort > "$LIST"
            COUNT="$(wc -l < "$LIST" | tr -d ' ')"
            echo "files in snapshot: ${COUNT}"
            if [[ "$COUNT" -eq 0 ]]; then
              echo "ERROR: no files matched *${LATEST_DATE}*"
              exit 1
            fi
            head -n 40 "$LIST" || true
            echo "... (showing up to 40 names)"

            NAME="showcase_ftp_snapshot_${LATEST_DATE}"
            ARCHIVE="$OUT_DIR/${NAME}.tar.gz"
            # -T: список относительных путей; -C: корень web/
            tar -czf "$ARCHIVE" -C "$WEB_DIR" -T "$LIST"
            ls -lh "$ARCHIVE"

            # относительные пути из $HOME — drone-scp плохо берёт /tmp/*
            cp -f "$ARCHIVE" "$HOME/showcase_ftp_export.tar.gz"
            basename "$ARCHIVE" > "$HOME/showcase_ftp_export_name.txt"
            rm -f "$LIST"
            echo "packed ${NAME}.tar.gz"

      - name: Download archive from VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WEBAPP_VPS_HOST }}
          username: ${{ secrets.WEBAPP_VPS_USER }}
          key: ${{ secrets.WEBAPP_VPS_SSH_KEY }}
          password: ${{ secrets.WEBAPP_VPS_PASSWORD }}
          port: ${{ secrets.WEBAPP_VPS_PORT || 22 }}
          source: "showcase_ftp_export.tar.gz,showcase_ftp_export_name.txt"
          target: artifacts
          overwrite: true
          timeout: 60s
          command_timeout: 20m

      - name: Prepare artifact folder
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(find artifacts -type f -name 'showcase_ftp_export.tar.gz' | head -n1)"
          NAME_FILE="$(find artifacts -type f -name 'showcase_ftp_export_name.txt' | head -n1)"
          if [[ -z "${SRC}" ]]; then
            echo "ERROR: archive not downloaded"
            find artifacts -type f | head -n 50 || true
            exit 1
          fi
          ARCHIVE_NAME="showcase_ftp_snapshot.tar.gz"
          if [[ -n "${NAME_FILE}" ]]; then
            ARCHIVE_NAME="$(tr -d '\r\n' < "${NAME_FILE}")"
          fi
          cp "$SRC" "dist/${ARCHIVE_NAME}"
          ls -lh dist/
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup on VPS
        if: always()
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.WEBAPP_VPS_HOST }}
          username: ${{ secrets.WEBAPP_VPS_USER }}
          key: ${{ secrets.WEBAPP_VPS_SSH_KEY }}
          password: ${{ secrets.WEBAPP_VPS_PASSWORD }}
          port: ${{ secrets.WEBAPP_VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.WEBAPP_VPS_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/apps/bi-analytics-showcase}"
            rm -rf "$APP_DIR"/webapp/data/exports/staging
            rm -f "$APP_DIR"/webapp/data/exports/showcase_ftp_snapshot_*.tar.gz
            rm -f "$HOME"/showcase_ftp_export.tar.gz "$HOME"/showcase_ftp_export_name.txt
            echo "cleanup done"
