# Manual deploy of Next webapp to ai.conall.ru (prod on iivm :3081).
# Dev cloudpub stays on auto-deploy via webapp.yml → :3080.
#
# Uses same host secrets as cloudpub (WEBAPP_VPS_*), different path.
# Optional override: PROD_VPS_PATH (default ~/apps/bi-analytics-webapp-prod)
name: Deploy ai.conall.ru prod

on:
  workflow_dispatch:

concurrency:
  group: webapp-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy prod over SSH (iivm)
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.WEBAPP_VPS_HOST }}
          username: ${{ secrets.WEBAPP_VPS_USER }}
          password: ${{ secrets.WEBAPP_VPS_PASSWORD }}
          key: ${{ secrets.WEBAPP_VPS_SSH_KEY }}
          port: ${{ secrets.WEBAPP_VPS_PORT || 2275 }}
          command_timeout: 45m
          script_stop: true
          envs: XCA_ASK_SECRET,XCA_ASK_BASE_URL,GH_FETCH_TOKEN,TRELLO_API_KEY,TRELLO_TOKEN,TRELLO_BOARD_ID,TRELLO_LIST_URGENT,TRELLO_LIST_BUG,TRELLO_LIST_UI,TRELLO_LIST_FEATURE,TRELLO_LIST_QUESTION,TRELLO_LIST_TRIAGE,TRELLO_LABEL_URGENT,TRELLO_LABEL_BUG,TRELLO_LABEL_UI,TRELLO_LABEL_FEATURE,TRELLO_LABEL_QUESTION,TRELLO_LABEL_TRIAGE,BUG_REPORT_DRY_RUN
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.PROD_VPS_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/apps/bi-analytics-webapp-prod}"
            mkdir -p "$(dirname "$APP_DIR")"
            if [[ ! -d "$APP_DIR/.git" ]]; then
              git clone https://github.com/pyLexxDramma/bi-analytics-showcase.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            if [[ -n "${GH_FETCH_TOKEN:-}" ]]; then
              git remote set-url origin "https://x-access-token:${GH_FETCH_TOKEN}@github.com/pyLexxDramma/bi-analytics-showcase.git"
            fi
            git fetch origin
            git checkout main
            git reset --hard origin/main
            chmod +x webapp/scripts/server_deploy_prod.sh webapp/scripts/ftp_daily_ingest_prod.sh webapp/scripts/sync_prod_web_data_to_opencode.sh webapp/scripts/set_admin_password_prod.sh || true
            if [[ ! -f webapp/.env ]] && [[ -f "$HOME/apps/bi-analytics-showcase/webapp/.env" ]]; then
              cp "$HOME/apps/bi-analytics-showcase/webapp/.env" webapp/.env
              echo "Seeded webapp/.env from cloudpub showcase"
            fi
            export XCA_ASK_SECRET="${XCA_ASK_SECRET:-}"
            export XCA_ASK_BASE_URL="${XCA_ASK_BASE_URL:-}"
            export TRELLO_API_KEY="${TRELLO_API_KEY:-}"
            export TRELLO_TOKEN="${TRELLO_TOKEN:-}"
            export TRELLO_BOARD_ID="${TRELLO_BOARD_ID:-}"
            export TRELLO_LIST_URGENT="${TRELLO_LIST_URGENT:-}"
            export TRELLO_LIST_BUG="${TRELLO_LIST_BUG:-}"
            export TRELLO_LIST_UI="${TRELLO_LIST_UI:-}"
            export TRELLO_LIST_FEATURE="${TRELLO_LIST_FEATURE:-}"
            export TRELLO_LIST_QUESTION="${TRELLO_LIST_QUESTION:-}"
            export TRELLO_LIST_TRIAGE="${TRELLO_LIST_TRIAGE:-}"
            export TRELLO_LABEL_URGENT="${TRELLO_LABEL_URGENT:-}"
            export TRELLO_LABEL_BUG="${TRELLO_LABEL_BUG:-}"
            export TRELLO_LABEL_UI="${TRELLO_LABEL_UI:-}"
            export TRELLO_LABEL_FEATURE="${TRELLO_LABEL_FEATURE:-}"
            export TRELLO_LABEL_QUESTION="${TRELLO_LABEL_QUESTION:-}"
            export TRELLO_LABEL_TRIAGE="${TRELLO_LABEL_TRIAGE:-}"
            export BUG_REPORT_DRY_RUN="${BUG_REPORT_DRY_RUN:-0}"
            export WEBAPP_CORS_ORIGINS="https://ai.conall.ru"
            bash webapp/scripts/server_deploy_prod.sh
            echo "Prod deployed $(git rev-parse --short HEAD) edge :3081"
            echo "Set admin password on server: BI_NEW_ADMIN_PASSWORD='…' bash webapp/scripts/set_admin_password_prod.sh"
        env:
          XCA_ASK_SECRET: ${{ secrets.XCA_ASK_SECRET }}
          XCA_ASK_BASE_URL: ${{ secrets.XCA_ASK_BASE_URL }}
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_URGENT: ${{ secrets.TRELLO_LIST_URGENT }}
          TRELLO_LIST_BUG: ${{ secrets.TRELLO_LIST_BUG }}
          TRELLO_LIST_UI: ${{ secrets.TRELLO_LIST_UI }}
          TRELLO_LIST_FEATURE: ${{ secrets.TRELLO_LIST_FEATURE }}
          TRELLO_LIST_QUESTION: ${{ secrets.TRELLO_LIST_QUESTION }}
          TRELLO_LIST_TRIAGE: ${{ secrets.TRELLO_LIST_TRIAGE }}
          TRELLO_LABEL_URGENT: ${{ secrets.TRELLO_LABEL_URGENT }}
          TRELLO_LABEL_BUG: ${{ secrets.TRELLO_LABEL_BUG }}
          TRELLO_LABEL_UI: ${{ secrets.TRELLO_LABEL_UI }}
          TRELLO_LABEL_FEATURE: ${{ secrets.TRELLO_LABEL_FEATURE }}
          TRELLO_LABEL_QUESTION: ${{ secrets.TRELLO_LABEL_QUESTION }}
          TRELLO_LABEL_TRIAGE: ${{ secrets.TRELLO_LABEL_TRIAGE }}
          BUG_REPORT_DRY_RUN: ${{ secrets.BUG_REPORT_DRY_RUN }}
