# Manual deploy of Next webapp to ai.conall.ru (prod on iivm :3081).
# Dev cloudpub stays on auto-deploy via webapp.yml → :3080.
#
# Secrets:
#   PROD_VPS_HOST, PROD_VPS_USER, PROD_VPS_PASSWORD and/or PROD_VPS_SSH_KEY,
#   PROD_VPS_PORT (2275), PROD_VPS_PATH (~/apps/bi-analytics-webapp-prod)
#   XCA_ASK_SECRET, XCA_ASK_BASE_URL (same as cloudpub)
name: Deploy ai.conall.ru prod

on:
  workflow_dispatch:

concurrency:
  group: webapp-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy prod over SSH (iivm)
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          password: ${{ secrets.PROD_VPS_PASSWORD }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          port: ${{ secrets.PROD_VPS_PORT || 2275 }}
          command_timeout: 45m
          script_stop: true
          envs: XCA_ASK_SECRET,XCA_ASK_BASE_URL
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.PROD_VPS_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/apps/bi-analytics-webapp-prod}"
            mkdir -p "$(dirname "$APP_DIR")"
            if [[ ! -d "$APP_DIR/.git" ]]; then
              git clone https://github.com/pyLexxDramma/bi-analytics-showcase.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git reset --hard origin/main
            # Seed .env from cloudpub once if missing
            if [[ ! -f webapp/.env ]] && [[ -f "$HOME/apps/bi-analytics-showcase/webapp/.env" ]]; then
              cp "$HOME/apps/bi-analytics-showcase/webapp/.env" webapp/.env
              echo "Seeded webapp/.env from cloudpub showcase"
            fi
            export XCA_ASK_SECRET="${XCA_ASK_SECRET:-}"
            export XCA_ASK_BASE_URL="${XCA_ASK_BASE_URL:-}"
            export WEBAPP_CORS_ORIGINS="https://ai.conall.ru"
            bash webapp/scripts/server_deploy_prod.sh
            echo "Prod deployed $(git rev-parse --short HEAD) edge :3081"
        env:
          XCA_ASK_SECRET: ${{ secrets.XCA_ASK_SECRET }}
          XCA_ASK_BASE_URL: ${{ secrets.XCA_ASK_BASE_URL }}
