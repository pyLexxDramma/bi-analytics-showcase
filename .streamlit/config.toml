# Production localhost / streamlit_app.py (основной дашборд).
# Светлая тема showcase — только через showcase_app.py + showcase/theme.py.

[client]
showSidebarNavigation = false

[server]
enableStaticServing = true
headless = true

[theme]
base = "dark"
font = "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
headingFont = "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
codeFont = "Consolas, 'Courier New', monospace"
primaryColor = "#6CB4EE"
backgroundColor = "#12385C"
secondaryBackgroundColor = "#0d2b47"
textColor = "#E8EEF5"
linkColor = "#B8D4F0"
