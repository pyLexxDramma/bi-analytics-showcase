# Конфиг Streamlit только для showcase (main file: showcase_app.py).
# На Cloud: у второго приложения можно указать этот файл через Advanced settings
# или скопировать секцию [theme] в secrets — см. README в showcase/.

[client]
showSidebarNavigation = false

[server]
enableStaticServing = true

[theme]
base = "light"
font = "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
headingFont = "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
codeFont = "Consolas, 'Courier New', monospace"
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
linkColor = "#1d4ed8"
