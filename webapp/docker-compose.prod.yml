# Prod override for ai.conall.ru (iivm).
# Usage: COMPOSE_PROJECT_NAME=webapp-prod docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# !override replaces base ports (Compose merge would otherwise keep 3080 AND 3081).
services:
  edge:
    ports: !override
      - "3081:3080"

  api:
    environment:
      WEBAPP_DATA_MODE: ftp
      WEBAPP_CORS_ORIGINS: ${WEBAPP_CORS_ORIGINS:-https://ai.conall.ru,https://insipidly-carefree-husky.cloudpub.ru}
      SHOWCASE_AI_ENABLED: "1"
