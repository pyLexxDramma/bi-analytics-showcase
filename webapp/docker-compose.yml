services:
  api:
    build:
      context: ./api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      WEBAPP_DATA_MODE: ${WEBAPP_DATA_MODE:-synthetic}
      WEBAPP_ADMIN_TOKEN: ${WEBAPP_ADMIN_TOKEN:-}
      WEBAPP_CORS_ORIGINS: ${WEBAPP_CORS_ORIGINS:-*}
      SHOWCASE_WEB_DIR: ${SHOWCASE_WEB_DIR:-/showcase/showcase_data/web}
      WEBAPP_ROOT: /app
      SHOWCASE_ROOT: /showcase
      BI_CORE_APP_DIR: /core
      WEB_DB_PATH: ${WEB_DB_PATH:-/data/db/web_data.db}
      BI_USERS_DB: ${BI_USERS_DB:-/data/db/users.db}
      BI_BOOTSTRAP_ADMIN_USERNAME: ${BI_BOOTSTRAP_ADMIN_USERNAME:-admin}
      BI_BOOTSTRAP_ADMIN_PASSWORD: ${BI_BOOTSTRAP_ADMIN_PASSWORD:-}
      WEBAPP_AUTH_SECRET: ${WEBAPP_AUTH_SECRET:?WEBAPP_AUTH_SECRET is required}
      WEBAPP_AUTH_TOKEN_TTL_SECONDS: ${WEBAPP_AUTH_TOKEN_TTL_SECONDS:-28800}
      WEBAPP_REPORT_CACHE_DIR: ${WEBAPP_REPORT_CACHE_DIR:-/data/report_cache}
      BI_FTP_HOST: ${BI_FTP_HOST:-}
      BI_FTP_USER: ${BI_FTP_USER:-}
      BI_FTP_PASSWORD: ${BI_FTP_PASSWORD:-}
      BI_FTP_REMOTE_DIR: ${BI_FTP_REMOTE_DIR:-/web}
      BI_FTP_PORT: ${BI_FTP_PORT:-21}
      BI_FTP_TLS: ${BI_FTP_TLS:-0}
      WEBAPP_API_WORKERS: ${WEBAPP_API_WORKERS:-1}
      WEBAPP_JOBS_DIR: ${WEBAPP_JOBS_DIR:-/data/jobs}
      SHOWCASE_OPENCODE_URL: http://opencode:4096
      SHOWCASE_OPENCODE_WORKSPACE: /workspace
      SHOWCASE_ASSISTANT_DB: /data/db/assistant.db
      SHOWCASE_ASSISTANT_OUTPUT_DIR: /data/assistant_output
      SHOWCASE_VLLM_BASE_URL: ${SHOWCASE_VLLM_BASE_URL:-}
      SHOWCASE_VLLM_API_KEY: ${SHOWCASE_VLLM_API_KEY:-}
      SHOWCASE_VLLM_MODEL: ${SHOWCASE_VLLM_MODEL:-cyankiwi/Qwen3.8-27B-AWQ-INT4}
      SHOWCASE_AI_ENABLED: ${SHOWCASE_AI_ENABLED:-0}
      XCA_ASK_BASE_URL: ${XCA_ASK_BASE_URL:-}
      XCA_ASK_SECRET: ${XCA_ASK_SECRET:-}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      TRELLO_BOARD_ID: ${TRELLO_BOARD_ID:-}
      TRELLO_LIST_URGENT: ${TRELLO_LIST_URGENT:-}
      TRELLO_LIST_BUG: ${TRELLO_LIST_BUG:-}
      TRELLO_LIST_UI: ${TRELLO_LIST_UI:-}
      TRELLO_LIST_FEATURE: ${TRELLO_LIST_FEATURE:-}
      TRELLO_LIST_QUESTION: ${TRELLO_LIST_QUESTION:-}
      TRELLO_LIST_TRIAGE: ${TRELLO_LIST_TRIAGE:-}
      TRELLO_LABEL_URGENT: ${TRELLO_LABEL_URGENT:-}
      TRELLO_LABEL_BUG: ${TRELLO_LABEL_BUG:-}
      TRELLO_LABEL_UI: ${TRELLO_LABEL_UI:-}
      TRELLO_LABEL_FEATURE: ${TRELLO_LABEL_FEATURE:-}
      TRELLO_LABEL_QUESTION: ${TRELLO_LABEL_QUESTION:-}
      TRELLO_LABEL_TRIAGE: ${TRELLO_LABEL_TRIAGE:-}
      BUG_REPORT_DRY_RUN: ${BUG_REPORT_DRY_RUN:-0}
    # OOM на ГДРС уже был: лимит явный, чтобы падал контейнер, а не весь VPS
    mem_limit: ${WEBAPP_API_MEM_LIMIT:-1200m}
    volumes:
      - ./data/web:/data/web
      - ./data/db:/data/db
      - ./data/report_cache:/data/report_cache
      - ./data/jobs:/data/jobs
      - ./data/assistant_output:/data/assistant_output
      - ../showcase_data:/showcase/showcase_data:ro
      - ../bi-analytics-v-5-main:/core:ro
      - ../showcase_app.py:/showcase/showcase_app.py:ro
    # internal only — edge proxies /api
    expose:
      - "8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    build:
      context: ./api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command:
      - python
      - -c
      - "import sqlite3; sqlite3.connect('/data/db/web_data.db').close()"
    volumes:
      - ./data/db:/data/db
    restart: "no"

  opencode:
    build:
      context: ../bi-analytics-v-5-main/opencode_web
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.13}
    restart: unless-stopped
    environment:
      SHOWCASE_VLLM_BASE_URL: ${SHOWCASE_VLLM_BASE_URL:-}
      SHOWCASE_VLLM_API_KEY: ${SHOWCASE_VLLM_API_KEY:-}
      SHOWCASE_VLLM_MODEL: ${SHOWCASE_VLLM_MODEL:-cyankiwi/Qwen3.8-27B-AWQ-INT4}
      SHOWCASE_VLLM_MODEL_ID: ${SHOWCASE_VLLM_MODEL_ID:-cyankiwi/Qwen3.8-27B-AWQ-INT4}
      SHOWCASE_VLLM_CONTEXT: ${SHOWCASE_VLLM_CONTEXT:-32768}
      SHOWCASE_VLLM_OUTPUT: ${SHOWCASE_VLLM_OUTPUT:-8192}
    volumes:
      - ./data/db:/workspace/data:ro
      - ./data/assistant_output:/workspace/analytics/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4096"
    depends_on:
      db-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        # same-origin via Caddy edge
        NEXT_PUBLIC_API_BASE: ""
        NEXT_PUBLIC_AI_MODE: ${NEXT_PUBLIC_AI_MODE:-stub}
        NEXT_PUBLIC_OPENCODE_URL: ${NEXT_PUBLIC_OPENCODE_URL:-https://opencode.conall.ru/L3dvcmtzcGFjZQ/session}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_AI_MODE: ${NEXT_PUBLIC_AI_MODE:-stub}
      NEXT_PUBLIC_OPENCODE_URL: ${NEXT_PUBLIC_OPENCODE_URL:-https://opencode.conall.ru/L3dvcmtzcGFjZQ/session}
    expose:
      - "3000"
    depends_on:
      - api

  edge:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "3080:3080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
